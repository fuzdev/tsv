# Restriction lints (`unwrap_used` / `expect_used` / `panic` / `unreachable`)
# are warn-level workspace-wide (see Cargo.toml `[workspace.lints.clippy]`) so
# a production panic point takes `#[expect(<lint>, reason = "…")]` (`#[allow]`
# only where `expect` can't see its lint fire, with a comment saying why).
# Tests panic on assertion failure by design, so the unwrap/expect/panic trio is
# allowed there via the settings below. (`unreachable` has no in-tests toggle, but tests use
# `panic!`/`assert!`, not `unreachable!`, so none is needed.)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
