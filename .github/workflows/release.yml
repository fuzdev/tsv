# The release workflow: the N-API npm packages — the @fuzdev/tsv loader + the
# six @fuzdev/tsv-<triple> platform packages — and the tag's GitHub Release.
# This is the per-platform matrix the single-machine scripts/publish.ts
# deliberately does NOT own:
# publish.ts releases the WASM set and pushes the annotated v* tag, and that tag
# triggers this workflow. The tag is also the assertion that the local
# external-oracle conformance gates (publish Step 3b) ran — they read sibling
# checkouts this runner has no reason to clone, so they are NOT re-run here.
#
# Per target: build the napi-profile cdylib (release + panic=unwind — the
# shipped panic contract) AND the tsv_cli binary (release: abort + LTO — a
# process that owns its own crash), both PROFILE-GUIDED and trained on the
# target itself (scripts/pgo/pgo.ts: instrument, train each binary as itself
# over the fuzdev/corpora snapshot's own collections, merge, rebuild with the
# profile; gates that the profile is non-empty and applied, that nothing
# instrumented ships, and that the output is byte-identical to a plain build's),
# stage the platform package (addon + CLI binary), gate it (glibc floor / musl
# purity over BOTH binaries, the depth limits' stack contract in the staged
# addon, the PGO size bounds, the npm-shape test over the real artifacts),
# upload. The publish job downloads all six, stages the
# loader, re-arms the CLI binaries' executable bit (artifact transport drops
# file modes), and publishes platforms-then-loader idempotently
# (scripts/publish_napi.ts) — a partial matrix never publishes anything.
#
# Linux builds run inside containers via explicit `docker run` steps, not
# job-level `container:`: the gnu rows build in almalinux:8 so the artifact's
# glibc floor is 2.28 — Node's own binary floor, i.e. every machine that can
# run modern Node can load tsv_napi (covers RHEL 8, Amazon Linux 2, and
# everything newer) — and the musl row builds in rust:alpine (with
# -crt-static off: a cdylib must link musl dynamically). Staging and tests
# run on the runner HOST, outside the containers; the 2.28-floor artifact
# loads fine on the host's newer glibc. The musl artifact CANNOT load into the
# host's glibc Node, so its npm-shape test runs in a node:alpine container
# instead — which is also the real deployment environment it exists for.
#
# Auth: NPM_TOKEN secret (granular, publish-only) for the bootstrap releases —
# npm trusted publishing is only configurable on packages that already exist.
# Once the packages are live, configure Trusted Publishers and switch this
# to OIDC, dropping the token. `id-token: write` is already scoped on the
# publish job for `npm --provenance`.
#
# After a real publish, the `release` job creates the GitHub Release for the
# tag: body = CHANGELOG.md's stamped `## <version>` section
# (scripts/release_notes.ts); assets = each platform package's native `tsv`
# CLI binary + SHA512SUMS, pulled back from the registry
# (scripts/release_assets.ts) so an asset is byte-identical to what npm
# serves, plus the binaries' third-party NOTICE from the checkout, each with a
# Sigstore provenance attestation
# (actions/attest-build-provenance; `gh attestation verify <file> -R fuzdev/tsv`).
#
# Last, the `crates` job rehearses the crates.io release of the workspace's
# publishable crates (scripts/publish_crates.ts): every crate packaged and
# built from its own tarball, and the public-API gate (cargo semver-checks)
# against each crate's published baseline. It is a DRY RUN on every trigger —
# the first publish is by token from a maintainer's machine, and a publishing
# leg waits on crates.io trusted publishing (configured per crate once it
# exists, naming this workflow file).
#
# workflow_dispatch runs the whole matrix and gates with `npm publish
# --dry-run` by default — the pre-tag rehearsal; set dry_run=false for a real
# publish (the recovery path for a failed tag run). That recovery must be
# dispatched on the release TAG: the tag is what ties the staged version to a
# released commit (the tag↔version assertion keys on the ref) and what the
# `release` job keys on, so a real publish off a branch — which would ship
# whatever version that branch stages, from source that may have moved past
# the release commit, and mint no Release — is REFUSED before any target
# builds. A branch dispatch can only rehearse.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and gate everything; npm publish --dry-run (the crates job always dry-runs)'
        type: boolean
        default: true
  schedule:
    # Weekly rot-watch: the full matrix — musl + the almalinux gnu containers
    # + the mac/win release legs, each with its PGO training and gates — builds
    # and gates, then DRY-RUNS the publish,
    # so a container/runner/toolchain breakage surfaces within a week instead
    # of at release rehearsal. None of these legs is exercised by PR CI (the
    # platforms job covers glibc/mac/win via the dev build path), and a per-PR
    # musl job would duplicate this for breakage classes PRs don't cause.
    # Scheduled runs are FORCED dry-run in the publish step — a scheduled real
    # publish could ship the current version's napi set unintentionally.
    - cron: '17 6 * * 1'

permissions:
  contents: read

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    # Uniform scripting across the matrix (bash exists on the windows runners).
    shell: bash

jobs:
  build:
    strategy:
      # Publish requires ALL six artifacts (a partial set never publishes),
      # but let every target report — a one-target failure with five green
      # uploads means a re-run only rebuilds what changed.
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64-gnu
            runner: ubuntu-24.04
            build: gnu-container
          - triple: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            build: gnu-container
          - triple: linux-x64-musl
            runner: ubuntu-24.04
            build: musl-container
          - triple: darwin-arm64
            runner: macos-15
            build: native
          # Native on an Intel runner (macOS 15, like the arm64 row): each row
          # trains and gates its binaries where they run. Under Rosetta 2 on an
          # arm64 runner the x86_64 training and gates run an order of magnitude
          # slower, and the depth gate's control pass, which natively dies of its
          # stack overflow at once, neither dies nor finishes there.
          - triple: darwin-x64
            runner: macos-15-intel
            build: native
          - triple: win32-x64
            runner: windows-2025
            build: native
    runs-on: ${{ matrix.runner }}
    # The fat-LTO builds (the plain CLI, the instrumented pair, the profile-use
    # pair), the depth shapes' test build, the two training passes, and the
    # byte-identity and depth gates.
    timeout-minutes: 120

    steps:
      # A REAL publish must run on the release tag (see the trigger comment). A
      # dispatch on a branch may only rehearse (dry_run=true, the default); one
      # asking for a real publish is refused here, in seconds and before any
      # target builds, rather than at the publish step 30+ minutes in. The
      # publish step restates the rule as its own last line of defence.
      - name: Refuse a real publish that is not on a tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_type != 'tag'
        run: |
          echo "::error::a real publish (dry_run=false) must be dispatched on the release tag, not on '$GITHUB_REF_NAME' — dispatch it on the tag, or leave dry_run=true to rehearse"
          exit 1

      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain for the native rows: the one pinned in rust-toolchain.toml,
      # installed by the runner's preinstalled rustup (any rustup 1.28+ reads the
      # file with no arguments, so skip self-updating it). The container rows
      # install the same pin themselves. Every row also takes the pin's
      # `llvm-tools-preview` on the HOST: its `llvm-profdata` merges the
      # training profiles (it must be rustc's own LLVM — scripts/pgo/pgo.ts
      # checks) and its `llvm-readobj` reads the binaries' sections. The
      # container rows' host may lack rustup (the arm64 image), so it is
      # installed there when missing.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.build == 'native'
        with:
          # One cache per row, keyed by the triple it builds rather than by the
          # default key's job name.
          key: ${{ matrix.triple }}

      # The container rows' cache: cargo/rustup homes + target live under the
      # workspace (mounted into the container) so actions/cache can carry them.
      # Only the plain build's `target/`: the PGO builds go to .pgo/, which no
      # cache on any row holds — cargo fingerprints the RUSTFLAGS text, not the
      # profile's bytes, so a restored profile-use build would ship an earlier
      # profile's codegen.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.build != 'native'
        with:
          path: |
            .container-cargo
            .container-rustup
            target
          key: napi-${{ matrix.triple }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: napi-${{ matrix.triple }}-

      # For the PGO steps (scripts/pgo/pgo.ts runs under Node, and stages through
      # scripts/roots/build_napi_packages.ts on the host), the size bands and the
      # npm-shape test (`node --test` executes the .ts directly via native type
      # stripping, >= 22.18). None of them imports a package, so this job installs
      # no npm dependencies. Pinned to match check.yml.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'

      # The shipped binaries are profile-guided (scripts/pgo/pgo.ts, whose module
      # doc lists the steps below in order). The training corpus is the
      # fuzdev/corpora snapshot's `origin: own` collections, pinned by the
      # `collections/` TREE id in benches/js/lib/gate_counts.ts — a tree cannot
      # be fetched, so the entry also records a commit, which is shallow-fetched
      # and refused unless its tree is the pinned one and every file holds
      # the commit's line endings (the Windows image sets core.autocrlf;
      # the checkout turns conversion off). .pgo/ is made here, on
      # the host, so the steps that write it from the host can after a
      # container (as root) has built into it.
      - name: Fetch the training corpus
        run: |
          mkdir -p .pgo
          node scripts/pgo/pgo.ts corpora --fetch

      # Each leg builds the PLAIN `release` tsv_cli (the byte-identity reference
      # the PGO binaries must match) and the instrumented pair (scripts/pgo/build.sh,
      # the one spelling of the PGO RUSTFLAGS) in one environment.
      - name: Build plain + instrumented (native)
        if: matrix.build == 'native'
        run: |
          cargo build --locked -p tsv_cli --release
          sh scripts/pgo/build.sh instrument .pgo

      - name: Build plain + instrumented (almalinux:8 — glibc 2.28 floor)
        if: matrix.build == 'gnu-container'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/.container-cargo \
            -e RUSTUP_HOME=/work/.container-rustup \
            almalinux:8 bash -ec '
              dnf install -y -q gcc curl
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              export PATH="/work/.container-cargo/bin:$PATH"
              rustup toolchain install --no-self-update
              cargo build --locked -p tsv_cli --release
              sh scripts/pgo/build.sh instrument .pgo'

      - name: Build plain + instrumented (rust:alpine — musl)
        if: matrix.build == 'musl-container'
        # -crt-static off: rust's musl target defaults to a static CRT, and a
        # cdylib addon must link musl dynamically (it loads into Alpine Node).
        # The CLI binary builds in the same environment, so it links musl
        # dynamically too — fine for the Alpine hosts this package selects on.
        # The image tag follows rust-toolchain.toml's pin, so the image already
        # carries that toolchain; the install adds the file's components and
        # targets. build.sh keeps the RUSTFLAGS it is handed.
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/.container-cargo \
            -e RUSTFLAGS='-C target-feature=-crt-static' \
            "rust:${channel:?no channel in rust-toolchain.toml}-alpine" sh -ec '
              apk add --no-cache musl-dev
              rustup toolchain install --no-self-update
              cargo build --locked -p tsv_cli --release
              sh scripts/pgo/build.sh instrument .pgo'

      # The instrumented pair as an installed @fuzdev/tsv loader + platform
      # package (under .pgo/, never left in crates/tsv_napi/pkg/), so the addon
      # trains through the loader's own cli.js.
      - name: Stage the instrumented pair
        run: node scripts/pgo/pgo.ts stage --phase instrument --triple ${{ matrix.triple }}

      # Training runs each binary AS ITSELF where it runs: the gnu rows on the
      # host (the 2.28-floor binaries run on its newer glibc), the native rows
      # natively.
      - name: Train
        if: matrix.build != 'musl-container'
        run: node scripts/pgo/pgo.ts train --triple ${{ matrix.triple }}

      # The dynamic musl binaries cannot run on the glibc host: train in the
      # environment the npm-shape test already uses, the corpus mounted read-only.
      - name: Train (node:alpine)
        if: matrix.build == 'musl-container'
        run: |
          docker run --rm -v "$PWD:/work" -v "$PWD/../corpora:/corpora:ro" -w /work \
            node:24.14.1-alpine \
            node scripts/pgo/pgo.ts train --triple ${{ matrix.triple }} --corpora /corpora

      # The merge (the toolchain's own llvm-profdata) and the non-empty-profile
      # gate: real counts on the renderer and every language's parse entries.
      - name: Merge the profiles
        run: node scripts/pgo/pgo.ts merge --triple ${{ matrix.triple }}

      - name: Build profile-use (native)
        if: matrix.build == 'native'
        run: sh scripts/pgo/build.sh use .pgo

      - name: Build profile-use (almalinux:8 — glibc 2.28 floor)
        if: matrix.build == 'gnu-container'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/.container-cargo \
            -e RUSTUP_HOME=/work/.container-rustup \
            almalinux:8 bash -ec '
              dnf install -y -q gcc
              export PATH="/work/.container-cargo/bin:$PATH"
              sh scripts/pgo/build.sh use .pgo'

      - name: Build profile-use (rust:alpine — musl)
        if: matrix.build == 'musl-container'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/.container-cargo \
            -e RUSTFLAGS='-C target-feature=-crt-static' \
            "rust:${channel:?no channel in rust-toolchain.toml}-alpine" sh -ec '
              apk add --no-cache musl-dev
              rustup toolchain install --no-self-update
              sh scripts/pgo/build.sh use .pgo'

      # The profile was APPLIED: no profile diagnostic in the use builds' logs
      # but the build scripts' and dead code's (a hash mismatch, or a missing
      # function the instrumented binary's raw profiles record in the module
      # diagnosed, is a stale or partly applied profile, which falls back to no
      # PGO silently; the Mach-O and COFF links drop a dead function's records,
      # so their use builds name the dead code — pgo.ts gate-builds sorts them,
      # failing any diagnosed module of a crate the instrumented records name
      # under a CGU hash they do not give it, a use build from another crate
      # world); and
      # nothing instrumented ships — the trained binaries must show their
      # instrumentation sections (the check's positive control) and the use
      # binaries none.
      - name: Profile-applied and no-instrumentation gates
        run: |
          node scripts/pgo/pgo.ts gate-builds --triple ${{ matrix.triple }}
          node scripts/pgo/pgo.ts gate-sections --triple ${{ matrix.triple }}

      # The profile-use pair is the platform package: staged into
      # crates/tsv_napi/pkg/<triple>/ (and laid out under .pgo/ for the
      # byte-identity gate's cli.js run).
      - name: Stage platform package
        run: node scripts/pgo/pgo.ts stage --phase use --triple ${{ matrix.triple }}

      # The measured floor: the highest versioned glibc symbol each shipped
      # artifact references must not exceed 2.28 — the gate that keeps the
      # container choice honest (a build accidentally run on the host would
      # fail here). Covers the addon AND the CLI binary, as staged.
      - name: glibc floor gate (gnu, <= 2.28)
        if: matrix.build == 'gnu-container'
        run: |
          for artifact in crates/tsv_napi/pkg/${{ matrix.triple }}/tsv_napi.node crates/tsv_napi/pkg/${{ matrix.triple }}/tsv; do
            # objdump runs alone (not in the substitution pipeline) so an unreadable
            # artifact fails the step loudly instead of vanishing under pipefail; the
            # grep pipeline takes `|| true` so a no-match yields the visible "none"
            # rather than killing the step inside the assignment.
            objdump -T "$artifact" > /tmp/syms.txt
            max=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' /tmp/syms.txt | sort -uV | tail -1 || true)
            echo "$artifact max versioned glibc symbol: ${max:-none}"
            if [ -n "$max" ]; then
              top=$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)
              if [ "$top" != "GLIBC_2.28" ]; then
                echo "FAIL: glibc floor exceeded in $artifact ($max > 2.28) — was the build run outside the container?"
                exit 1
              fi
            fi
          done

      # The musl twin: a musl artifact must reference NO versioned glibc
      # symbols at all (any GLIBC_ ref means a glibc contamination the alpine
      # load test might even survive via compat shims — fail it here).
      - name: musl purity gate
        if: matrix.build == 'musl-container'
        run: |
          for artifact in crates/tsv_napi/pkg/${{ matrix.triple }}/tsv_napi.node crates/tsv_napi/pkg/${{ matrix.triple }}/tsv; do
            # objdump runs alone first: inside the `if` pipeline its failure — exactly
            # what a missing or non-dynamic artifact produces — would read as "no
            # GLIBC_ refs" and pass the gate vacuously.
            objdump -T "$artifact" > /tmp/syms.txt
            if grep -q 'GLIBC_' /tmp/syms.txt; then
              echo "FAIL: musl artifact $artifact references GLIBC_ symbols"
              exit 1
            fi
          done

      # PGO changes code layout, never output: the PGO CLI and the PGO addon
      # (through the staged cli.js) must format the whole snapshot and every
      # fixture to the plain CLI's bytes; over the fixture inputs and a stride of
      # the snapshot, both must parse and strip to its bytes, and the PGO addon's
      # import records must equal the instrumented addon's — on the target, in
      # the environment that runs it (node:alpine for musl).
      - name: Byte identity (PGO vs plain)
        if: matrix.build != 'musl-container'
        run: node scripts/pgo/pgo.ts byteid --triple ${{ matrix.triple }}

      - name: Byte identity (PGO vs plain, node:alpine)
        if: matrix.build == 'musl-container'
        run: |
          docker run --rm -v "$PWD:/work" -v "$PWD/../corpora:/corpora:ro" -w /work \
            node:24.14.1-alpine \
            node scripts/pgo/pgo.ts byteid --triple ${{ matrix.triple }} --corpora /corpora

      # The depth limits' stack contract in the addon that SHIPS: every shape
      # tests/depth_limit.rs generates, at its accepted depth, through the staged
      # PGO addon on a worker thread sized to the contract less its margin
      # (scripts/pgo/addon_depth.ts). The profile moves inlining, and with it
      # frame sizes, and no test build reproduces the shipped frames (a test
      # graph compiles the language crates with other features, so the profile
      # matches none of their functions) — so the binary itself is graded, on
      # every row. A native overflow kills the process; a control pass on a far
      # smaller thread must die first (the setting is a live limit), or the gate
      # fails as vacuous; a pass still running at its bound is killed and fails
      # as hung, so a wedged one never runs into the job's timeout. The shapes
      # are counts, not frames, so the host writes them (a `corpus`-profile test
      # build, under .pgo/ beside the container rows' root-owned target/).
      - name: Depth shapes
        run: CARGO_TARGET_DIR=.pgo/target-shapes node scripts/pgo/pgo.ts depth-shapes

      # On win32-x64 libuv asks Windows for
      # the worker's stack as its initial COMMIT, and the reserve is node.exe's own
      # unless the commit is not smaller (then the commit rounded up to a MiB). So
      # each pass runs under its own scratch COPY of node.exe (.pgo/depth/
      # node-control.exe and node-gate.exe; the real one is only read) whose PE
      # stack reserve sits just above that pass's request: each thread is that
      # reserve, within 64 KiB of its request, so the gate keeps nearly the tenth
      # margin of every other row. Both threads are printed. The step falls back
      # to the plain-profile native gate (test:depth:napi's cargo test, a fat-LTO
      # test build — its time counts against the job's timeout), logged as a
      # FALLBACK and a ::warning::, when a copy cannot be made or does not start, when
      # the gate's thread would still exceed the contract, or when the control
      # survives on a thread the reserve, not its request, sized. Any other
      # surviving control fails.
      - name: Depth contract (staged PGO addon)
        if: matrix.build != 'musl-container'
        run: node scripts/pgo/pgo.ts depth --triple ${{ matrix.triple }}

      - name: Depth contract (staged PGO addon, node:alpine)
        if: matrix.build == 'musl-container'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            node:24.14.1-alpine \
            node scripts/pgo/pgo.ts depth --triple ${{ matrix.triple }}

      # The PGO bands: a profile that did not apply reads as a plain-sized
      # binary, and a re-enabled cost-benefit inliner as a far larger one.
      - name: Size bounds
        run: node scripts/roots/validate_napi_artifact.ts --triple ${{ matrix.triple }} --pgo

      # The npm-shape test over the REAL artifacts: loader platform-resolution,
      # the wasm-parity options surface, the packaged .node, and the `tsv` bin
      # dispatching to the packaged CLI binary. (The panic-contract
      # probe test runs per OS in check.yml's platforms job on every PR; it
      # needs a separate probe build, and the contract is profile+attribute
      # determined — identical across targets — so it is not re-proven here.)
      - name: npm-shape test
        if: matrix.build != 'musl-container'
        run: node --test scripts/test_napi_npm.ts

      # The musl artifact can't load into the host's glibc Node — test it in
      # the environment it exists for.
      - name: npm-shape test (node:alpine)
        if: matrix.build == 'musl-container'
        run: |
          docker run --rm -v "$PWD:/work" -w /work node:24.14.1-alpine \
            node --test scripts/test_napi_npm.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ matrix.triple }}
          path: crates/tsv_napi/pkg/${{ matrix.triple }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm --provenance

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN at publish.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          registry-url: 'https://registry.npmjs.org'

      # Each artifact extracts to pkg/napi-<triple>/; rename to the pkg/<triple>
      # layout the staging/publish scripts share.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: crates/tsv_napi/pkg

      - name: Arrange platform packages
        run: |
          for d in crates/tsv_napi/pkg/napi-*; do
            mv "$d" "crates/tsv_napi/pkg/${d##*/napi-}"
          done
          ls crates/tsv_napi/pkg

      # On Node's own modules alone: this job holds the npm credentials, so it
      # installs no npm dependencies (docs/tasks.md §`build:napi:packages`).
      - name: Stage loader package
        run: node scripts/roots/build_napi_packages.ts --loader-only

      # Completeness (every platform the loader pins, versions in lockstep),
      # tag↔version agreement, platforms-then-loader order, and
      # skip-if-already-published idempotency all live in the script; a dry run
      # skips nothing, packing every package with `npm publish --dry-run` even
      # at a version already live. A missing NPM_TOKEN secret yields
      # an EMPTY token, which `npm view` (public) and `npm publish --dry-run`
      # both tolerate — so the dry-run rehearsal works before the secret exists.
      #
      # The two flags answer independent questions, so they key on different
      # things. `--expect-tag` follows the REF: any run whose ref is a tag must
      # agree with it, which covers the tag push AND a recovery dispatched on
      # the release tag. Dry-run-ness follows the EVENT — and a REAL publish
      # additionally requires the tag ref (the build job's guard refuses a
      # tagless one up front; restated here so the step that can publish holds
      # the rule itself), so the only tagless path is a rehearsal.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flags+=(--expect-tag "$GITHUB_REF_NAME")
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$DRY_RUN" = "true" ]; then
            # schedule is ALWAYS dry-run — see the trigger comment.
            flags+=(--dry-run)
          elif [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::refusing a real publish off the non-tag ref '$GITHUB_REF_NAME' — dispatch it on the release tag"
            exit 1
          else
            flags+=(--provenance)
          fi
          deno run --allow-read --allow-write=crates/tsv_napi/pkg --allow-env --allow-run=npm scripts/publish_napi.ts "${flags[@]}"

  # The GitHub Release for the tag: the CHANGELOG's stamped `## <version>`
  # section as the body (scripts/release_notes.ts) and, as assets, the native
  # `tsv` CLI binary of every platform package plus a SHA512SUMS — pulled back
  # FROM THE REGISTRY (scripts/release_assets.ts), so an asset is byte-identical
  # to what npm serves even on a recovery re-run, where the matrix rebuilds
  # while the publish step skips the versions already live — and the third-party
  # NOTICE the binaries' license terms require beside them (from the checkout).
  # Runs only after a REAL publish: the tag push, or a dry_run=false dispatch on the tag (the
  # only real publish the workflow admits — a tagless one is refused before
  # the matrix builds); the weekly schedule and dry-run dispatches never create
  # a Release. The first create attaches the assets in the same call, so a
  # Release is never public without them. Idempotent: an existing Release is
  # kept and its assets re-uploaded with --clobber (same bytes, by the registry
  # sourcing above). The job holds the only `contents: write` and
  # `attestations: write` in the workflow, and no npm token.
  release:
    needs: publish
    if: github.ref_type == 'tag' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    # Above scripts/release_assets.ts's ~10 min registry retry window.
    timeout-minutes: 20
    permissions:
      contents: write # gh release create + asset upload
      id-token: write # attest-build-provenance (Sigstore cert)
      attestations: write # attest-build-provenance (persist the attestation)

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (gh reads GH_TOKEN, not git config).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'

      - name: Release notes
        run: |
          deno run --allow-read scripts/release_notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release_notes.md"
          cat "$RUNNER_TEMP/release_notes.md"

      # The script's registry reads retry for a bounded window: this runs
      # seconds after the publish job, and a just-published version can lag the
      # registry's read path.
      - name: Collect assets from the registry
        run: |
          deno run --allow-read --allow-write --allow-run=npm,tar \
            scripts/release_assets.ts "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/assets"
          cat "$RUNNER_TEMP/assets/SHA512SUMS"

      # Provenance attestation over EVERY asset — the binaries, the NOTICE and
      # the SHA512SUMS beside them, so a verifier who fetches only the checksum file
      # has something to verify it against (Sigstore, stored on the repo;
      # `gh attestation verify <file> -R fuzdev/tsv`). Ahead of the Release so a
      # failed attestation fails before anything is public; a re-run attests
      # again (several attestations for one digest are fine). The npm packages
      # carry the same bytes under npm's own `--provenance`. No storage record:
      # that needs the newer `artifact-metadata: write` permission, and the
      # attestation alone is what `gh attestation verify` reads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*
          create-storage-record: false

      # --verify-tag: refuse to mint a Release for a tag the remote doesn't
      # hold (gh would otherwise create the tag itself at the checkout's SHA).
      # The first create takes the assets as positional files, so the Release
      # never appears without them; a re-run (Release already present) keeps
      # its notes and only re-uploads.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — re-uploading assets only"
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/* --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release_notes.md"
          fi

  # The crates.io half of the release, as a rehearsal: scripts/publish_crates.ts
  # dry-runs on every trigger — the tag push, a dispatch (dry_run or not) and
  # the weekly cron. It packages every publishable crate and builds each one
  # alone from its tarball against its siblings' tarballs, in dependency order
  # (`cargo publish --workspace --dry-run --locked`), and runs the public-API
  # gate: `cargo semver-checks` per crate at its docs.rs feature set, against
  # its published baseline on crates.io — a crate with none is SKIPPED, loudly,
  # never passed. On the tag the version is new, so each crate with a release
  # on crates.io is graded at the level the version change states; on the cron
  # the version is usually already live, so the gate skips (`--bump` grades it
  # locally). A runner is fresh, so the stale-overlay trap the script clears
  # (an unchanged version reusing an earlier run's unpacked tarballs) cannot
  # bite here, and the job restores no cache that could bring it back.
  #
  # After `publish` and `release` (skipped on a rehearsal) because the crates
  # publish last, once the version's npm packages and GitHub Release exist:
  # tsv_cli's binstall metadata points at that Release's assets.
  # Nothing here publishes: the step never passes --wetrun, and the job holds
  # no token.
  crates:
    needs: [publish, release]
    if: always() && needs.publish.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    # A cold packaging build of every crate plus the semver-checks rustdoc
    # builds, with headroom.
    timeout-minutes: 45

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain pinned in rust-toolchain.toml (see the build job).
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # Pinned to the version the gate is written against; bump deliberately.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks@0.51.0

      # scripts/publish_crates.ts runs under Node on @fuzdev/gro's host modules
      # (docs/tasks.md §`publish:crates`), the one script this job runs. Pinned
      # to match the other jobs.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'

      # The root package-lock.json's tree, install scripts off by the root .npmrc.
      # Installed here because this job holds no token, unlike `publish` and
      # `release`, which install nothing.
      - name: Install npm dependencies
        run: npm ci

      # `--expect-tag` follows the REF, as in the publish job. Never --wetrun.
      # npm passes what follows `--` to the script, and nothing for an empty list.
      - name: Publish crates (dry run)
        run: |
          flags=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flags+=(--expect-tag "$GITHUB_REF_NAME")
          fi
          npm run publish:crates -- "${flags[@]}"
