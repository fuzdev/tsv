[workspace]
resolver = "2"
members = [
    "crates/tsv_lang",
    "crates/tsv_html",
    "crates/tsv_ts",
    "crates/tsv_css",
    "crates/tsv_svelte",
    "crates/tsv_cli",
    "crates/tsv_debug",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["tsv contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Foundation
tsv_lang = { path = "crates/tsv_lang" }
tsv_html = { path = "crates/tsv_html" }

# Language implementations
tsv_ts = { path = "crates/tsv_ts" }
tsv_css = { path = "crates/tsv_css" }
tsv_svelte = { path = "crates/tsv_svelte" }

# External dependencies
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1.11"
string-interner = "0.19"

[workspace.lints.rust]
unsafe_code = "forbid"
# Allow missing Debug - some types contain non-Debug fields (Chars, RefCell<Interner>, etc.)
# TODO: Consider adding manual Debug impls for key public types (Lexer, Printer, etc.)
missing_debug_implementations = "allow"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Enable lint groups (priority -1 so individual lints can override)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Pedantic overrides
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Style preferences - explicit can be clearer
use_self = "allow"
doc_markdown = "allow"
# TODO: Run `cargo clippy --fix` to inline format args, then enable this lint
uninlined_format_args = "allow"
unreadable_literal = "allow"
option_if_let_else = "allow"
if_not_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
redundant_else = "allow"
manual_let_else = "allow"
# These are style choices that can go either way
wildcard_imports = "allow"
unused_self = "allow"
unnested_or_patterns = "allow"
explicit_iter_loop = "allow"
match_wildcard_for_single_variants = "allow"
needless_pass_by_value = "allow"
bool_to_int_with_if = "allow"
unnecessary_wraps = "allow"
fn_params_excessive_bools = "allow"
comparison_chain = "allow"
large_enum_variant = "allow"
too_long_first_doc_paragraph = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
implicit_hasher = "allow"
doc_link_with_quotes = "allow"
return_self_not_must_use = "allow"
case_sensitive_file_extension_comparisons = "allow"
needless_continue = "allow"
unnecessary_debug_formatting = "allow"
# Documentation lints - allow for flexibility
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Parser-specific: common pattern with u32 positions
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"

# Nursery overrides
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
branches_sharing_code = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
unnecessary_literal_bound = "allow"
equatable_if_let = "allow"
useless_let_if_seq = "allow"
# Lifetimes - explicit can be clearer
elidable_lifetime_names = "allow"

# Cargo overrides
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Restriction lints (panic points need explicit #[allow] with justification)
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"
# Note: todo! macro allowed per project convention (see CLAUDE.md)
# TODO: Audit the ~72 unwrap/expect usages and add explicit #[allow] with safety justification

# Root package for integration tests
[package]
name = "tsv"
version.workspace = true
edition.workspace = true

[dependencies]
tsv_lang.workspace = true
tsv_ts.workspace = true
tsv_css.workspace = true
tsv_svelte.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tsv_debug = { path = "crates/tsv_debug" }
tsv_cli = { path = "crates/tsv_cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
