[package]
name = "tsv_ignore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "gitignore-style path matching for tsv's file discovery (.prettierignore / .formatignore)"
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# zero dependencies by design — a pure, hand-rolled gitignore(5) matcher keeps
# the format-only WASM artifact tiny (no regex/globset) and sidesteps the
# dependency-approval gate. See CLAUDE.md.

[lints]
workspace = true
