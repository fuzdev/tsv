[package]
name = "tsv_lang"
version.workspace = true
edition.workspace = true
description = "Language-agnostic foundation primitives for tsv"
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[features]
# Opt-in render-time line-comment swallow check (diagnostic). Off by default so
# production artifacts (wasm/cli/ffi) — and default `tsv_debug` builds, whose
# profiles must measure production-shaped render code — compile it out entirely:
# no `DocArena` side-set field, no render-loop hook. `tsv_debug` forwards this
# feature (off by default there too) to drive `swallow_audit`. See src/doc/swallow.rs.
internal_swallow_check = []
# Opt-in perf census counters (diagnostic). Off by default so every production
# artifact and every default `tsv_debug` perf build compiles the counters — and the
# session call sites that feed them — out entirely. `tsv_debug` forwards it. See
# src/census.rs.
internal_census = []
# Opt-in print-once comment ledger (diagnostic): every comment a document parses must
# be emitted exactly once. Off by default, same reasoning as `internal_swallow_check` — no
# registration in the format entry points, no record hook in the printers' comment
# seams. `tsv_ts` / `tsv_css` / `tsv_svelte` / `tsv_debug` each forward it. See
# src/comment_ledger.rs.
internal_comment_check = []
# Opt-in work counters for `tsv_debug build_fanout_audit` (diagnostic): node builds at the
# printers' build dispatch, doc-walk visits, source-scan steps. Off by default, same reasoning
# as `internal_swallow_check` — every call site compiles to nothing. `tsv_debug` forwards it. See
# src/fanout_probe.rs.
internal_fanout_check = []
# Umbrella that turns on every diagnostic seam at once (`internal_swallow_check` +
# `internal_comment_check` + `internal_fanout_check`). The audit deno tasks build one binary under this feature
# instead of one per seam. Off by default, same as its members — production
# artifacts and default `tsv_debug` profile/perf builds compile all of it out.
internal_audits = ["internal_swallow_check", "internal_comment_check", "internal_fanout_check"]
# Shared wire-JSON writer substrate (`json_writer`), pulled in transitively by
# each language crate's `json` feature. Off in the format-only
# @fuzdev/tsv-format-wasm build, so `zmij` never enters that graph.
json = ["dep:zmij"]
# The loc-bearing wire: the line table `WireTables` builds beside its map, which is the
# only thing that makes `WirePositions::lines` non-`None`. Off in every binding (they
# ship the span-only wire alone), so the writers' `loc` emitters compile to dead code
# and drop out of those artifacts; `tsv_cli` (`tsv parse --locations`) and `tsv_debug`
# turn it on through each language crate's own `locations` feature.
locations = ["json"]

[dependencies]
smallvec.workspace = true
# Only for the regex-vs-division rule's non-ASCII identifier arm (`source_scan`).
unicode-ident.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
# Only for the `json` feature's wire-JSON writer, whose `f64` emitter formats a
# non-integral number with it, as `serde_json` does. Optional so format-only builds
# leave it out.
zmij = { workspace = true, optional = true }

[dev-dependencies]
# The oracle the wire writer is graded against: its hand string escaper
# (`string_matches_serde_json`) and its `f64` emitter (`f64_matches_serde_json`)
# must write exactly what `serde_json` writes. Test-only: the shipped crate has no
# `serde_json` dependency, so the workspace entry's features never reach a consumer.
serde_json.workspace = true

[lints]
workspace = true
