[package]
name = "tsv_svelte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Svelte parsing and formatting library"
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at these features: the wire writers with `loc`, so the
# whole parse surface is documented. `deno task docs:audit:docsrs` builds the same shape.
# One target: nothing here differs by platform.
features = ["locations"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["json"]
# The wire-JSON layer: `parse_to_json*` and the writer behind it (`ast/convert/write.rs`). Forwards to
# tsv_ts/tsv_css because the writer composes their embedded emitters.
json = ["tsv_lang/json", "tsv_ts/json", "tsv_css/json"]
# The loc-bearing wire (`JsonOptions::locations`) — see `tsv_lang`'s
# `locations` feature. Off in every binding.
locations = ["json", "tsv_lang/locations", "tsv_ts/locations", "tsv_css/locations"]
# Opt-in print-once comment ledger (`tsv_lang::comment_ledger`): the format entry points
# register `Root.comments`, the four JS-comment doc builders record each emit, and the
# format-ignore seams (raw `<script>`/`<style>`, the template node + range forms) record
# their verbatim ranges. Forwards to tsv_ts/tsv_css, which emit the comments inside the
# `<script>`/`{expr}`/`<style>` islands. Off in production builds.
internal_comment_check = ["tsv_lang/internal_comment_check", "tsv_ts/internal_comment_check", "tsv_css/internal_comment_check"]

[dependencies]
tsv_lang.workspace = true
tsv_html.workspace = true
tsv_ts.workspace = true
tsv_css.workspace = true
bumpalo.workspace = true
smallvec.workspace = true

[dev-dependencies]
# The convert-layer unit tests read the wire back into a `Value` (shallow inputs, the
# default reader). The shipped crate never deserializes.
serde_json.workspace = true

[lints]
workspace = true
