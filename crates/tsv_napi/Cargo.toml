[package]
name = "tsv_napi"
version.workspace = true
edition.workspace = true
description = "TypeScript and Svelte tools - N-API bindings for Node.js and Bun"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tsv_svelte.workspace = true
tsv_ts.workspace = true
tsv_css.workspace = true
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"

# N-API macros require unsafe code internally - override workspace lint
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Relax some pedantic lints for binding code
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
