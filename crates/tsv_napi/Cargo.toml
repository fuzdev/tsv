[package]
name = "tsv_napi"
version.workspace = true
edition.workspace = true
description = "precise language tools for TypeScript/JS, CSS, and Svelte - N-API bindings (Node.js/Bun)"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tsv_svelte = { workspace = true }
tsv_ts = { workspace = true }
tsv_css = { workspace = true }
# Per-thread reusable AST/doc arenas, shared with tsv_ffi. The workspace entry
# is default-features = false (AST-arena helper only), so a parse-only build
# doesn't pull tsv_lang (the doc-arena helper's dep); the `format` feature below
# re-enables it.
tsv_arena = { workspace = true }
# The format path's line-terminator fold (`printing::normalize_carriage_returns`), applied
# ahead of the parse. The DIRECT edge is format-only, matching this crate's feature
# discipline; the crate is in the graph either way (every language crate depends on it), so
# the parse-only build is unchanged.
tsv_lang = { workspace = true, optional = true }
# The discovery matcher behind the `IgnoreStack` class and its verdict methods,
# the same pair `tsv_wasm` exposes — format-only, since discovery exists to feed
# the formatter.
tsv_ignore = { workspace = true, optional = true }
tsv_discover = { workspace = true, optional = true }
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
# Test-only: the in-crate tests parse the returned JSON AST to assert its root
# type. The bindings themselves never touch serde_json — the parse path returns
# the already-serialized string from `convert_ast_json_string`.
serde_json.workspace = true

[features]
# Mirrors tsv_ffi / tsv_wasm: `format` exports the formatters, `parse` exports
# the parsers plus the wire-JSON convert layer they emit through. The
# default both-features build is what the Node bench loads.
default = ["format", "parse"]
# Pulls the reusable doc arena (`tsv_arena::with_doc_arena`, which pulls
# tsv_lang), plus the `IgnoreStack` discovery matcher and its verdict methods.
format = ["tsv_arena/format", "dep:tsv_ignore", "dep:tsv_discover", "dep:tsv_lang"]
parse = ["tsv_ts/convert", "tsv_css/convert", "tsv_svelte/convert"]
# Test-only: compiles the `__panic_probe` export that `deno task test:napi`
# drives to prove the panic contract end to end (panic → thrown JS error →
# addon still usable). Never enabled by a published build; `test_napi.ts` skips
# the contract test when the export is absent.
panic_probe = []

# `napi-derive` generates unsafe code. Cargo replaces the whole [lints] table on
# override (no partial inherit), so the workspace lints are re-declared verbatim
# below — only `unsafe_code` differs. Keep in sync with the root
# [workspace.lints] block; the restriction lints (panic/unwrap_used/etc.) must
# stay so this crate keeps the same floor as the rest of the workspace.
#
# `deny`, not `allow`: `#[napi]` expands to items carrying their own
# `#[allow(unsafe_code)]`, and an inner `allow` overrides `deny` — it cannot
# override `forbid`, which is why inheriting the workspace table fails to
# compile and this override exists at all. So `deny` lets the macro's generated
# items through while every OTHER site in the crate still has to justify itself,
# and this crate hand-writes no unsafe at all — so today nothing does. The
# exemption stays scoped to the generated N-API surface instead of the whole
# crate: a hand-written `unsafe` block added here is a compile error.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic overrides
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
use_self = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
option_if_let_else = "allow"
if_not_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
wildcard_imports = "allow"
unused_self = "allow"
unnested_or_patterns = "allow"
explicit_iter_loop = "allow"
match_wildcard_for_single_variants = "allow"
needless_pass_by_value = "allow"
bool_to_int_with_if = "allow"
unnecessary_wraps = "allow"
fn_params_excessive_bools = "allow"
comparison_chain = "allow"
large_enum_variant = "allow"
too_long_first_doc_paragraph = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
implicit_hasher = "allow"
doc_link_with_quotes = "allow"
return_self_not_must_use = "allow"
case_sensitive_file_extension_comparisons = "allow"
needless_continue = "allow"
unnecessary_debug_formatting = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
# Nursery overrides
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
branches_sharing_code = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
unnecessary_literal_bound = "allow"
equatable_if_let = "allow"
useless_let_if_seq = "allow"
elidable_lifetime_names = "allow"
# Cargo overrides
cargo_common_metadata = "allow"      # internal crates, not published to crates.io
# Restriction lints (panic points need explicit #[allow] with justification)
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
unwrap_used = "warn"
