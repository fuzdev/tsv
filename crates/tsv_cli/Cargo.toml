[package]
name = "tsv_cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for TSV tools"

[[bin]]
name = "tsv"
path = "src/main.rs"

[dependencies]
tsv_lang.workspace = true
tsv_svelte = { workspace = true, features = ["convert"] }
tsv_ts = { workspace = true, features = ["convert"] }
tsv_css = { workspace = true, features = ["convert"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
