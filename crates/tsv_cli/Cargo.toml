[package]
name = "tsv_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for tsv tools"
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: the lib is the CLI's internals, whose few
# platform-gated lines need no page of their own.
targets = ["x86_64-unknown-linux-gnu"]

# `cargo binstall tsv_cli` fetches the prebuilt `tsv` binary from the version's GitHub Release
# (the assets the release workflow uploads, named by npm triple — hence an override per Rust
# target). The musl asset links musl dynamically, so it stays unmapped (binstall also tries a
# musl target as a glibc host's fallback, where it could not start); every unmapped target
# builds from source rather than from a third-party build. `deno task package:audit` grades
# this table against the workflow's matrix.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-{ target }{ binary-ext }"
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-linux-x64-gnu"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-linux-arm64-gnu"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-darwin-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-darwin-x64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tsv-win32-x64.exe"

[[bin]]
name = "tsv"
path = "src/main.rs"

[dependencies]
tsv_svelte = { workspace = true, features = ["json", "locations"] }
tsv_ts = { workspace = true, features = ["json", "locations"] }
tsv_css = { workspace = true, features = ["json", "locations"] }
tsv_lang.workspace = true
tsv_ignore.workspace = true
tsv_discover.workspace = true
argh.workspace = true
bumpalo.workspace = true

[lints]
workspace = true
