[package]
name = "tsv_debug"
version.workspace = true
edition.workspace = true
description = "Development utilities for TSV (AST debugging, printer comparison)"

[[bin]]
name = "tsv_debug"
path = "src/main.rs"

[dependencies]
tsv_cli = { path = "../tsv_cli" }
tsv_svelte.workspace = true
tsv_ts.workspace = true
tsv_css.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror.workspace = true

[lints]
workspace = true
