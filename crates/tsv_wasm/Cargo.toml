[package]
name = "tsv_wasm"
version.workspace = true
edition.workspace = true
description = "formatter and parser for TypeScript, Svelte, and CSS"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# Rust 2024 emits `memory.copy` (bulk-memory) and `i64.trunc_sat_f64_s`
# (nontrapping-float-to-int) — both shipped in every browser since 2021
# and in Node 16+. Enabling them by name lets wasm-opt run on Rust 2024 output.
wasm-opt = ['-O3', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[features]
# Default build: format-only (@fuzdev/tsv_fmt).
default = []
# `--features ast`: adds parse_* + convert layer (@fuzdev/tsv_parse).
ast = [
    "tsv_ts/convert",
    "tsv_css/convert",
    "tsv_svelte/convert",
    "dep:serde-wasm-bindgen",
]

[dependencies]
tsv_svelte.workspace = true
tsv_ts.workspace = true
tsv_css.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = { version = "0.6", optional = true }

[lints]
workspace = true
