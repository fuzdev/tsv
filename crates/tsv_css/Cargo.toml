[package]
name = "tsv_css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "CSS formatter and parser compatible with Svelte's parseCss — part of tsv"
categories = ["development-tools", "parser-implementations", "web-programming"]
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at these features: the wire writers with `loc`, so the
# whole parse surface is documented. `deno task docs:audit:docsrs` builds the same shape.
# One target: nothing here differs by platform.
features = ["locations"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["json"]
# The wire-JSON layer: `parse_to_json*` and the writer behind it (`ast/convert/write.rs`). Off in the
# @fuzdev/tsv-format-wasm build; on for every other consumer. Pulls in the
# shared wire-JSON writer substrate (`tsv_lang/json`) the emitter builds on.
json = ["tsv_lang/json"]
# The loc-bearing wire (`JsonOptions::locations`) — see `tsv_lang`'s
# `locations` feature. Off in every binding.
locations = ["json", "tsv_lang/locations"]
# Exposes `debug_token_stream` for the differential lexer harness (`tsv_debug
# lex_diff`). Off in production builds; enabled only by `tsv_debug`.
_internal_debug_lex = []
# Opt-in print-once comment ledger (`tsv_lang::comment_ledger`): the format entry
# points register the stylesheet's comments, `print_css_comment` /
# `comment_blocks_in_range` record each emit, and the raw-slice seams (format-ignore,
# glued compound selectors, unparseable selectors) record their ranges. Off in
# production builds.
_internal_comment_check = ["tsv_lang/_internal_comment_check"]

[dependencies]
tsv_lang.workspace = true
# Bump arena that owns the internal AST (caller-owns-`Bump`); shared with the
# host document's arena when CSS is embedded in a Svelte `<style>`.
bumpalo.workspace = true

[lints]
workspace = true
