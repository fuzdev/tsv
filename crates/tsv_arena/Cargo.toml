[package]
name = "tsv_arena"
version.workspace = true
edition.workspace = true
description = "Shared substrate for tsv's bindings: per-thread reusable arenas and the goal axis"
license.workspace = true
repository.workspace = true

[dependencies]
bumpalo.workspace = true
# Only the `format` feature needs tsv_lang — `with_doc_arena`'s `DocArena` type and
# `parse_format!`'s line-terminator fold (reached through the hidden `__tsv_lang`
# re-export, so the bindings need no tsv_lang edge of their own) — so the dep is
# optional and pulled by `format`: a parse-only binding gets just `with_ast_arena`.
tsv_lang = { workspace = true, optional = true }

[features]
# `format` adds the reusable doc arena (`with_doc_arena`) and `parse_format!`, both
# over tsv_lang;
# `with_ast_arena` is always available (parse and format both use it). Default-on
# so a standalone `cargo test -p tsv_arena` exercises every helper; the binding
# crates set `default-features = false` and re-enable `format` from their own
# `format` feature.
default = ["format"]
format = ["dep:tsv_lang"]

[lints]
workspace = true
