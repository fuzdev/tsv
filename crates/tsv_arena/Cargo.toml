[package]
name = "tsv_arena"
version.workspace = true
edition.workspace = true
description = "Shared substrate for tsv's bindings: the per-thread reusable doc arena and the goal axis"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only the `format` feature needs tsv_lang — `parse_format!`'s line-terminator fold and
# the thread's doc-arena slot (`tsv_lang::doc::arena::with_doc_arena`), both reached
# through the hidden `__tsv_lang` re-export, so the bindings' code needs no tsv_lang edge
# for them (tsv_wasm keeps one for its wasm32 layout pins) — so the dep is optional and
# pulled by `format`: a parse-only binding gets neither.
tsv_lang = { workspace = true, optional = true }

[features]
# `format` adds `parse_format!`, over tsv_lang's per-thread doc arena. Default-on so a
# standalone `cargo test -p tsv_arena` exercises it; the binding crates set `default-features = false` and re-enable `format`
# from their own `format` feature.
default = ["format"]
format = ["dep:tsv_lang"]
# `tape` adds the tape module: the binary parse wire's schema tables and the JSON → tape
# transcoder (docs/tape_format.md). It pulls nothing in, so a binding enables it from its
# `parse` feature without reaching the format-only build.
tape = []

[lints]
workspace = true
