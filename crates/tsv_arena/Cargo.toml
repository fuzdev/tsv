[package]
name = "tsv_arena"
version.workspace = true
edition.workspace = true
description = "Shared substrate for tsv's bindings: the per-thread reusable doc arena and the goal axis"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only the `format` and `tape` features need tsv_lang. `format`: `parse_format!`'s
# line-terminator fold and the thread's doc-arena slot (`tsv_lang::doc::arena::with_doc_arena`),
# both reached through the hidden `__tsv_lang` re-export, so the bindings' code needs no
# tsv_lang edge for them (tsv_wasm keeps one for its wasm32 layout pins). `tape`: the tape's
# sink (`tsv_lang::tape::TapeSink`, under its `_tape` and `_json` features), which the thread
# parks for `parse_tape!`. So the dep is optional: a binding with neither feature gets none of it.
tsv_lang = { workspace = true, optional = true }

[features]
# `format` adds `parse_format!`, over tsv_lang's per-thread doc arena. Default-on so a
# standalone `cargo test -p tsv_arena` exercises it; the binding crates set `default-features = false` and re-enable `format`
# from their own `format` feature.
default = ["format"]
format = ["dep:tsv_lang"]
# `tape` adds `parse_tape!` and the thread's parked tape sink it writes into (docs/tape_format.md).
# The writer is the language crate's own tape copy, so a binding enables it from its `parse`
# feature beside each language crate's `_tape`; the format-only build never compiles either.
tape = ["dep:tsv_lang", "tsv_lang/_tape", "tsv_lang/_json"]

[lints]
workspace = true
