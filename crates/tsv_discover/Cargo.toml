[package]
name = "tsv_discover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "tsv file-discovery policy: build-output heuristic + safety-net pruning over a tsv_ignore matcher"
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Only the matcher. Zero external dependencies by design (like tsv_ignore),
# keeping the format-only WASM artifact tiny and sidestepping the
# dependency-approval gate. See CLAUDE.md.
tsv_ignore = { workspace = true }

[lints]
workspace = true
