# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
phf.workspace = true
# May add tsv_lang later if needed

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
