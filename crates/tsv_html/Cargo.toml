[package]
name = "tsv_html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTML spec data: the named character references table, optional end tags and custom-element names (support crate for tsv)"
categories = ["development-tools", "parser-implementations", "web-programming"]
keywords = ["html", "whatwg", "entities", "parser"]
# The named-reference table (`src/entities_table.rs`) is WHATWG's list incorporated into source
# code, which WHATWG licenses under BSD-3-Clause; the rest is tsv's 0BSD. NOTICE carries both.
license = "0BSD AND BSD-3-Clause"
repository.workspace = true
# The agent notes stay in the repository, and so does the generator's input `src/entities.json`
# (CC BY 4.0 as data; the crate ships only the generated table). `deno task package:audit`
# grades the tarball.
exclude = ["CLAUDE.md", "src/entities.json"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]

[dev-dependencies]
# Only for the entity-table generator (`src/entities_gen.rs`, a unit test), which reads
# `src/entities.json` to generate the committed `src/entities_table.rs` and grade it
# fresh. The shipped crate parses no JSON.
serde_json.workspace = true

[lints]
workspace = true
