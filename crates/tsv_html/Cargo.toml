[package]
name = "tsv_html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTML-specific classification and whitespace rules for tsv"
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at its default features; `deno task docs:audit:docsrs`
# builds the same shape. One target: nothing here differs by platform.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]

[dev-dependencies]
# Only for the entity-table generator (`src/entities_gen.rs`, a unit test), which reads
# `src/entities.json` to generate the committed `src/entities_table.rs` and grade it
# fresh. The shipped crate parses no JSON.
serde_json.workspace = true

[lints]
workspace = true
