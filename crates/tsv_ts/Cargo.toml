[package]
name = "tsv_ts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TypeScript/JS formatter, type stripper and acorn-compatible parser — part of tsv"
categories = ["development-tools", "parser-implementations", "web-programming"]
license.workspace = true
repository.workspace = true
# This crate's agent notes stay in the repository; `deno task package:audit` grades the tarball.
exclude = ["CLAUDE.md"]

[package.metadata.docs.rs]
# docs.rs builds this crate alone, at these features: the wire writers with `loc`, so the
# whole parse surface is documented. `deno task docs:audit:docsrs` builds the same shape.
# One target: nothing here differs by platform.
features = ["locations"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["json"]
# The wire-JSON layer: `parse_to_json*` and the writer behind it (`ast/convert/write/`). Off in the
# @fuzdev/tsv-format-wasm build; on for every other consumer. Pulls in the
# shared wire-JSON writer substrate (`tsv_lang/json`) the emitter builds on.
json = ["tsv_lang/json"]
# The loc-bearing wire (`JsonOptions::locations`) — see `tsv_lang`'s
# `locations` feature. Off in every binding.
locations = ["json", "tsv_lang/locations"]
# Debug-only: exposes `debug_token_stream` for the differential lexer harness
# (`tsv_debug lex_diff`). Off in production builds.
_internal_debug_lex = []
# Debug-only: printer buffer-population sampling for `tsv_debug buffer_sizes`
# (chain/comment SmallVec length histograms). Off in production builds.
_internal_buffer_stats = []
# Opt-in print-once comment ledger (`tsv_lang::comment_ledger`): `format_ast_in` registers
# the program's comments, `build_comment_doc` records each emit, and the format-ignore
# verbatim seam records its range. Off in production builds.
_internal_comment_check = ["tsv_lang/_internal_comment_check"]

[dependencies]
tsv_lang.workspace = true
bumpalo.workspace = true
smallvec.workspace = true
unicode-ident.workspace = true

[lints]
workspace = true
